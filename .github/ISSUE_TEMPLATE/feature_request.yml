name: 功能建议
description: 提议聚焦的 ScopeLatch 能力或策略改进。
title: "[功能]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 工程问题
      description: 请描述失败模式或工作流缺口，而不只是期望增加的命令。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与替代方案
      description: 请提供可复现示例、风险和已经排除的方案。
  - type: checkboxes
    id: boundary
    attributes:
      label: 边界确认
      options:
        - label: 我理解 ScopeLatch 不是操作系统级沙箱。
          required: true
