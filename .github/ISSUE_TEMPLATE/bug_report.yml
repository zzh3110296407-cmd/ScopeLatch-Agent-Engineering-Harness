name: 缺陷报告
description: 报告可以稳定复现的 ScopeLatch 错误行为。
title: "[缺陷]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交凭据、私有仓库内容或未经脱敏的安全报告。
  - type: input
    id: version
    attributes:
      label: ScopeLatch 版本
      placeholder: 3.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options: [Windows, Linux, macOS, 其它]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为
      description: 请提供命令、脱敏输出和退出状态。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 请尽量使用公开仓库或人工构造的最小仓库。
    validations:
      required: true
