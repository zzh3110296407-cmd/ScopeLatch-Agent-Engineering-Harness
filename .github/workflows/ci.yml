name: ScopeLatch CI

on:
  pull_request:
    paths:
      - "harness/**"
      - ".codex/hooks/**"
      - ".harness/**"
      - "scripts/**"
      - "templates/**"
      - "docs/**"
      - "AGENTS.md"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "package.json"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "harness/**"
      - ".codex/hooks/**"
      - ".harness/**"
      - "scripts/**"
      - "templates/**"
      - "docs/**"
      - "AGENTS.md"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: scopelatch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.11.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Initialize local ScopeLatch config
        run: node harness/cli.mjs init
      - name: Run ScopeLatch tests and hook compilation
        run: npm test
      - name: Verify published evolution evidence
        run: npm run evidence:verify
      - name: Build repository indexes
        run: node harness/cli.mjs index
      - name: Verify source authority and configuration
        run: node harness/cli.mjs status
      - name: Verify configured source checks
        run: node harness/validators/run.mjs typecheck
      - name: Scan public release package
        run: node harness/cli.mjs security --profile public-release
      - name: Upload ScopeLatch security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scopelatch-security-report
          path: .harness/security/latest-security-report.json
          if-no-files-found: error
          include-hidden-files: true

  sandbox:
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.11.0"
      - name: Build and verify hardened ScopeLatch sandbox
        run: node harness/cli.mjs sandbox --verify --build
      - name: Upload sandbox verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scopelatch-sandbox-verification
          path: .harness/cache/sandbox/latest-runtime-verification.json
          if-no-files-found: error
          include-hidden-files: true
