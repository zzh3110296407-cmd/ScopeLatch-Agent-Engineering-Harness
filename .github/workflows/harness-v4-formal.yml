name: Harness v4 Formal

on:
  pull_request:
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: harness-v4-formal-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  formal:
    name: Harness v4 Formal Attestation
    if: ${{ vars.HARNESS_V4_FORMAL_ENABLED == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      HARNESS_FORMAL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HARNESS_FORMAL_CANDIDATE_REF: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      HARNESS_H8_QUALIFICATION_RUN_ID: ${{ vars.HARNESS_H8_QUALIFICATION_RUN_ID }}
    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout protected base authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HARNESS_FORMAL_BASE_REF }}
          fetch-depth: 0
          path: trusted-engine
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HARNESS_FORMAL_CANDIDATE_REF }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.11.0"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - name: Initialize ignored candidate Harness config
        working-directory: candidate
        run: node ../trusted-engine/harness/cli.mjs init

      - name: Download qualified H8 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: harness-v4-h8-qualified-observations
          path: trusted-engine/.harness/runtime/h8/observations
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HARNESS_H8_QUALIFICATION_RUN_ID }}

      - name: Verify required-check enforcement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $policyPath = "trusted-engine/harness/contracts/v4/formal-cutover-policy.json"
          $policy = Get-Content -Raw -LiteralPath $policyPath | ConvertFrom-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $requiredCheck = [string]$policy.workflow.requiredCheckName
          $branch = [string]$policy.protectedBranch
          $mode = $null
          $rawEvidence = $null
          try {
            $protection = Invoke-RestMethod `
              -Headers $headers `
              -Uri "$apiRoot/branches/$branch/protection/required_status_checks"
            $contexts = @($protection.contexts) + @($protection.checks | ForEach-Object { $_.context })
            if ($contexts -contains $requiredCheck) {
              $mode = "branch-protection"
              $rawEvidence = $protection | ConvertTo-Json -Depth 20 -Compress
            }
          } catch {
            Write-Output "Branch-protection evidence is unavailable; checking active rulesets."
          }
          if (-not $mode) {
            $rulesets = Invoke-RestMethod -Headers $headers -Uri "$apiRoot/rulesets?includes_parents=true"
            foreach ($summary in @($rulesets)) {
              if ($summary.enforcement -ne "active" -or $summary.target -ne "branch") { continue }
              $detail = Invoke-RestMethod -Headers $headers -Uri "$apiRoot/rulesets/$($summary.id)"
              $includes = @($detail.conditions.ref_name.include)
              $applies = $includes.Count -eq 0 `
                -or $includes -contains "~DEFAULT_BRANCH" `
                -or $includes -contains "refs/heads/$branch" `
                -or $includes -contains $branch
              if (-not $applies) { continue }
              $checks = @(
                $detail.rules |
                  Where-Object { $_.type -eq "required_status_checks" } |
                  ForEach-Object { $_.parameters.required_status_checks } |
                  ForEach-Object { $_.context }
              )
              if ($checks -contains $requiredCheck) {
                $mode = "ruleset"
                $rawEvidence = $detail | ConvertTo-Json -Depth 30 -Compress
                break
              }
            }
          }
          if (-not $mode -or -not $rawEvidence) {
            throw "H9_EXTERNAL_ENFORCEMENT_REQUIRED"
          }
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($rawEvidence)
            $digest = [Convert]::ToHexString($sha.ComputeHash($bytes)).ToLowerInvariant()
          } finally {
            $sha.Dispose()
          }
          $record = [ordered]@{
            schemaVersion = 1
            provider = "github"
            repository = $env:GITHUB_REPOSITORY
            protectedBranch = $branch
            mode = $mode
            requiredCheckName = $requiredCheck
            installed = $true
            verifiedAt = [DateTime]::UtcNow.ToString("o")
            evidenceDigest = "sha256:$digest"
          }
          $runtime = "trusted-engine/.harness/runtime/h9"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $record | ConvertTo-Json -Depth 10 |
            Set-Content -Encoding utf8 -LiteralPath "$runtime/enforcement.json"

      - name: Run trusted formal Auditor
        shell: pwsh
        env:
          HARNESS_FORMAL_BASE_COMMIT: ${{ env.HARNESS_FORMAL_BASE_REF }}
        run: >-
          node trusted-engine/harness/qualification/run-formal-ci.mjs
          --root candidate
          --trusted-root trusted-engine
          --base-ref "$env:HARNESS_FORMAL_BASE_REF"
          --h8-observations "trusted-engine/.harness/runtime/h8/observations"
          --enforcement "trusted-engine/.harness/runtime/h9/enforcement.json"
          --output ".harness/runs/h9-formal/formal-delivery.json"

      - name: Upload closed formal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-v4-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/.harness/runs/h9-formal/formal-delivery.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
