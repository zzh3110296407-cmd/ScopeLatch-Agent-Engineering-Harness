name: Harness v4 Shadow

on:
  pull_request:
    paths-ignore:
      - ".harness/docs/harness-v4-h8-ci-shadow-report.json"
  push:
    branches:
      - main
    paths-ignore:
      - ".harness/docs/harness-v4-h8-ci-shadow-report.json"
  workflow_dispatch:
    inputs:
      base_ref:
        description: Trusted base commit or ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harness-v4-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow:
    name: Non-authoritative V4 shadow
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      HARNESS_SHADOW_BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
      HARNESS_SHADOW_CANDIDATE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Enable Git long paths before checkout
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout protected base judge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.HARNESS_SHADOW_BASE_REF }}
          fetch-depth: 0
          path: trusted-engine
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.11.0"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"

      - name: Detect protected-base V4 judge
        id: trust-root
        shell: pwsh
        run: |
          $ready = $false
          $versionPath = "trusted-engine/harness/version.json"
          if (Test-Path -LiteralPath $versionPath) {
            try {
              $version = Get-Content -Raw -LiteralPath $versionPath | ConvertFrom-Json
              $major = [int](([string]$version.version).Split(".")[0])
              $required = @(
                "trusted-engine/harness/lib/v4",
                "trusted-engine/harness/auditor/cli.mjs",
                "trusted-engine/harness/qualification/run-shadow-pair.mjs"
              )
              $ready = $major -ge 4 -and @(
                $required | Where-Object { -not (Test-Path -LiteralPath $_) }
              ).Count -eq 0
            } catch {
              $ready = $false
            }
          }
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $ready) {
            Write-Output "H8_PROTECTED_BASE_V4_UNAVAILABLE"
          }

      - name: Initialize ignored candidate Harness config
        if: steps.trust-root.outputs.ready == 'true'
        working-directory: candidate
        run: node ../trusted-engine/harness/cli.mjs init

      - name: Run V4 baseline and cold/cached shadow
        id: shadow-pair
        if: steps.trust-root.outputs.ready == 'true'
        continue-on-error: true
        run: >-
          node trusted-engine/harness/qualification/run-shadow-pair.mjs
          --root candidate
          --trusted-root trusted-engine
          --base-ref "$env:HARNESS_SHADOW_BASE_REF"
          --output ".harness/runs/h8-shadow-observations/${{ github.run_id }}-${{ github.run_attempt }}.json"

      - name: Upload immutable shadow observation
        if: always() && steps.trust-root.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-v4-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/.harness/runs/h8-shadow-observations/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Record protected-base bootstrap block
        if: always() && steps.trust-root.outputs.ready != 'true'
        working-directory: candidate
        shell: pwsh
        run: |
          $directory = ".harness/runs/h8-shadow-bootstrap"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $record = [ordered]@{
            schemaVersion = 1
            status = "BOOTSTRAP_BLOCKED"
            reasonCode = "H8_PROTECTED_BASE_V4_UNAVAILABLE"
            baseRef = $env:HARNESS_SHADOW_BASE_REF
            candidateRef = $env:HARNESS_SHADOW_CANDIDATE_REF
            qualifiesForH8 = $false
            formalEligible = $false
            generatedAt = [DateTime]::UtcNow.ToString("o")
          }
          $record | ConvertTo-Json -Depth 10 |
            Set-Content -Encoding utf8 -LiteralPath "$directory/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"

      - name: Upload bootstrap-blocked diagnostic
        if: always() && steps.trust-root.outputs.ready != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-v4-shadow-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/.harness/runs/h8-shadow-bootstrap/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Declare non-authoritative shadow status
        if: always()
        shell: pwsh
        run: |
          Write-Output "Harness V4 shadow never authorizes merge or release."
          Write-Output "Promotion remains disabled until the tracked H8 qualification policy is satisfied."
